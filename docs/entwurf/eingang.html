<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eingang · opensecmon (Entwurf)</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/icons.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/eingang.js"></script>
</head>
<body>
<main class="inbox" id="main">
  <aside class="pane filters" id="filters" aria-label="Filter"></aside>

  <section class="list" aria-label="Treffer">
    <div class="listbar" id="listbar">
      <input type="checkbox" id="selAll" aria-label="Alle auswählen">
      <span class="nosel"><span class="title" id="listTitle">Offen</span> <span class="muted small" id="listCount"></span></span>
      <span class="bulk"><b id="bulkN"></b>
        <button class="btn sm primary" type="button" data-act="done">Erledigt</button>
        <button class="btn sm" type="button" data-act="ignore">Ignorieren</button>
        <button class="btn sm" type="button" data-act="later" data-pop>Später</button>
        <button class="btn sm ghost" type="button" id="bulkClear">Auswahl aufheben</button>
      </span>
      <span class="sp"></span>
      <button class="btn sm show-sm" type="button" id="openFilters">Filter</button>
      <label class="sr-only" for="sort">Sortierung</label>
      <select id="sort" class="nosel">
        <option value="prio">Priorität</option>
        <option value="neu">Neueste zuerst</option>
        <option value="host">Nach Host</option>
      </select>
    </div>
    <div class="chips" id="chips" hidden></div>
    <ul class="rows" id="rows" role="listbox" aria-label="Treffer nach Priorität"></ul>
    <div class="listfoot hide-sm"><kbd>j</kbd> <kbd>k</kbd> wählen · <kbd>e</kbd> erledigt · <kbd>i</kbd> ignorieren · <kbd>s</kbd> später · <kbd>?</kbd> alle Kürzel</div>
  </section>

  <section class="pane detail" id="detail" aria-label="Details" aria-live="polite"></section>
</main>

<div class="pop" id="laterPop" role="menu" aria-label="Später">
  <button type="button" role="menuitem" data-later="1">Morgen <span class="muted small">05.11.</span></button>
  <button type="button" role="menuitem" data-later="7">In 7 Tagen <span class="muted small">11.11.</span></button>
  <button type="button" role="menuitem" data-later="30">In 30 Tagen <span class="muted small">04.12.</span></button>
</div>

<div class="modal" id="ignoreModal" role="dialog" aria-modal="true" aria-labelledby="ignTitle">
  <header><h2 id="ignTitle">Ignorieren</h2><button class="iconbtn" type="button" data-close aria-label="Schließen"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></header>
  <div class="mbody">
    <div class="field">
      <label for="ignReason">Grund</label>
      <select id="ignReason">
        <option>Funktion nicht genutzt</option>
        <option>Nur im LAN erreichbar, Risiko akzeptiert</option>
        <option>Fehlalarm: Version oder Produkt passt nicht</option>
        <option>Anderer Grund</option>
      </select>
    </div>
    <div class="field">
      <label for="ignNote">Notiz <span class="muted">(optional)</span></label>
      <textarea id="ignNote" rows="2"></textarea>
    </div>
    <div class="field">
      <span class="label">Gilt für</span>
      <div id="ignAssets"></div>
      <label class="check"><input type="checkbox" name="future"><span>Auch künftige Meldungen zu diesem Produkt mit derselben Begründung ignorieren</span></label>
    </div>
    <p class="small muted">Ignorierte Treffer bleiben unter „Ignoriert“ sichtbar und lassen sich wieder öffnen.</p>
  </div>
  <footer><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" id="ignoreOk">Ignorieren</button></footer>
</div>
</body>
</html>
